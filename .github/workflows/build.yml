name: Build Yasuagram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
            TMessagesProj/build
            TMessagesProj_App/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<EOF2
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2
EOF2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --build-cache --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n1)" output/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasuagram
          path: output/app.apk
          if-no-files-found: error
