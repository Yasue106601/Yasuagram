name: Build Yasuagram APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasuagram-debug-apk
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
