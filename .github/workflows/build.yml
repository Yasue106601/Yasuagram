name: Build Yasuagram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Cache Android C++ build state
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
            ~/.gradle/caches
          key: yasuagram-cxx-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/**/*.cpp','TMessagesProj/jni/**/*.cc','TMessagesProj/jni/**/*.c','TMessagesProj/jni/**/*.h','TMessagesProj/jni/**/*.hpp','TMessagesProj/CMakeLists.txt','TMessagesProj/jni/**/CMakeLists.txt') }}
          restore-keys: |
            yasuagram-cxx-${{ runner.os }}-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --build-cache \
            --parallel \
            --no-daemon \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Prepare APK
        run: |
          mkdir -p output
          APK=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n1)
          test -n "$APK"
          cp "$APK" output/Yasuagram.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasuagram
          path: output/Yasuagram.apk
          if-no-files-found: error
