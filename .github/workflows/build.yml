name: Build Yasuagram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            TMessagesProj/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<EOT
          org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          org.gradle.configureondemand=true
          org.gradle.workers.max=4
          EOT

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --build-cache --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          find . -type f -name "*.apk" -exec cp {} artifact/ \;
          echo "APK files:"
          ls -lah artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yasuagram-APK
          path: artifact/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
